name: Task
description: Work that is neither a feature nor a bug, such as setup, refactoring or docs.
type: Task
body:
  - type: input
    id: opened-by
    attributes:
      label: Opened by
      description: Your name and the role you open it in, as "<name> (<role>)".
    validations:
      required: true
  - type: markdown
    attributes:
      value: After creating the issue, set its parent Sprint under **Relationships**.
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this work must not do or touch, and why or which issue owns it.
