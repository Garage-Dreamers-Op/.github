name: Spike
description: A time-boxed investigation that answers a question before building.
title: "Spike: "
type: Task
body:
  - type: markdown
    attributes:
      value: After creating the issue, set its parent Sprint under **Relationships**.
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision it unblocks
    validations:
      required: true
  - type: input
    id: time-box
    attributes:
      label: Time box
      placeholder: 1 day
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output
      options:
        - ADR
        - Research note
        - Prototype
        - Recommendation in a comment
    validations:
      required: true
