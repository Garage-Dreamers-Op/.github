name: Bug
description: Something is broken or behaves unexpectedly.
type: Bug
body:
  - type: markdown
    attributes:
      value: After creating the issue, set its parent Sprint under **Relationships**.
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks use
        - Workaround exists
        - Cosmetic
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, device or locker ID, anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
