name: Feature
description: New behaviour for users of the product.
type: Feature
body:
  - type: markdown
    attributes:
      value: After creating the issue, set its parent Sprint under **Relationships**.
  - type: textarea
    id: user-need
    attributes:
      label: User need
      description: Who needs what, and why.
      placeholder: As a <role>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Each criterion is one checkable behaviour.
      value: |
        - [ ] Given <context>, when <action>, then <outcome>
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: input
    id: notion
    attributes:
      label: Notion link
      placeholder: https://www.notion.so/...
  - type: textarea
    id: notes
    attributes:
      label: Notes
